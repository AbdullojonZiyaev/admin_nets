    // GLOBAL SEARCH
    function NGlobalSearch({ cache }) {
      const [q, setQ] = useState(''); const [open, setOpen] = useState(false);
      const ref = useRef(null);
      useEffect(() => {
        const h = e => { if (ref.current && !ref.current.contains(e.target)) { setOpen(false); setQ(''); } };
        document.addEventListener('mousedown', h); return () => document.removeEventListener('mousedown', h);
      }, []);
      function hl(text, query) {
        const s = String(text || ''); if (!query) return s;
        const i = s.toLowerCase().indexOf(query.toLowerCase()); if (i < 0) return s;
        return <>{s.slice(0, i)}<span className="gd-hl">{s.slice(i, i + query.length)}</span>{s.slice(i + query.length)}</>;
      }
      const q2 = q.trim().toLowerCase();
      const res = {
        billing: (q2 ? (cache.billing || []).filter(u => (u.name || '').toLowerCase().includes(q2) || String(u.billingId || '').includes(q2) || String(u.id || '').includes(q2)) : []).slice(0, 5),
        bitrix: (q2 ? (cache.bitrix || []).filter(u => (u.name || '').toLowerCase().includes(q2) || String(u.bitrixId || '').includes(q2) || String(u.id || '').includes(q2)) : []).slice(0, 5),
        links: (q2 ? (cache.links || []).filter(l => (l.billingUserName || '').toLowerCase().includes(q2) || (l.bitrixUserName || '').toLowerCase().includes(q2) || String(l.billingId || '').includes(q2) || String(l.bitrixId || '').includes(q2)) : []).slice(0, 4),
      };
      const total = res.billing.length + res.bitrix.length + res.links.length;
      const secs = [
        { k: 'billing', lbl: 'Биллинг', icon: <IBill />, items: res.billing, render: u => [u.name, `billing id: ${u.billingId || '—'} · #${u.id}`] },
        { k: 'bitrix', lbl: 'Битрикс', icon: <IUser />, items: res.bitrix, render: u => [u.name, `bitrix id: ${u.bitrixId || '—'} · #${u.id}`] },
        { k: 'links', lbl: 'Связи', icon: <ILink />, items: res.links, render: l => [`${l.billingUserName || '—'} → ${l.bitrixUserName || '—'}`, `billing: ${l.billingId} · bitrix: ${l.bitrixId}`] },
      ];
      return (
        <div className="gs" ref={ref}>
          <span className="gs-ico"><ISearch /></span>
          <input className="gs-inp" placeholder="Поиск по всем данным..." value={q}
            onChange={e => { setQ(e.target.value); setOpen(true); }} onFocus={() => setOpen(true)} />
          {!q && <span className="gs-kbd">⌘K</span>}
          {open && q2 && (
            <div className="gs-dd">
              {total === 0 && <div className="gd-empty">Ничего не найдено по «{q}»</div>}
              {secs.map(s => s.items.length > 0 && (
                <div key={s.k} className="gd-sec">
                  <div className="gd-hd">{s.lbl}</div>
                  {s.items.map((item, i) => {
                    const [nm, sb] = s.render(item); return (
                      <div key={i} className="gd-row" onClick={() => { setOpen(false); setQ(''); }}>
                        <div className="gd-ico">{s.icon}</div>
                        <div><div className="gd-nm">{hl(nm, q)}</div><div className="gd-sb">{sb}</div></div>
                      </div>
                    );
                  })}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // SMART SELECT
    function NSmartSelect({ options, value, onChange, placeholder = 'Выберите...' }) {
      const [open, setOpen] = useState(false); const [q, setQ] = useState('');
      const ref = useRef(null);
      useEffect(() => {
        const h = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener('mousedown', h); return () => document.removeEventListener('mousedown', h);
      }, []);
      const opts = options.filter(o => (o.label || '').toLowerCase().includes(q.toLowerCase()) || String(o.sub || '').includes(q));
      const sel = options.find(o => o.value === value);
      return (
        <div className="ss" ref={ref}>
          <div className={`ss-btn${open ? ' open' : ''}`} onClick={() => { setOpen(x => !x); setQ(''); }}>
            {sel ? <><span>{sel.label}</span><span className="ss-meta">id: {sel.sub}</span></> : <span className="ss-ph">{placeholder}</span>}
          </div>
          <span className={`ss-arr${open ? ' open' : ''}`}><IChev /></span>
          {open && (
            <div className="ss-dd">
              <input className="ss-srch" placeholder="Поиск..." value={q} onChange={e => setQ(e.target.value)} autoFocus />
              <div className="ss-list">
                {opts.length === 0 && <div className="ss-none">Ничего не найдено</div>}
                {opts.map(o => (
                  <div key={o.value} className={`ss-opt${value === o.value ? ' sel' : ''}`} onClick={() => { onChange(o.value); setOpen(false); setQ(''); }}>
                    <span>{o.label}</span><span className="ss-meta">id: {o.sub}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

          <main className="main">

    // ОБЗОР

            <div className="tw card">

    // БИЛЛИНГ
    function NBillingPage({ api, onCnt }) {
      const [data, setData] = useState([]); const [load, setLoad] = useState(true);
      const [srch, setSrch] = useState(''); const [modal, setModal] = useState(false);
      const [editM, setEditM] = useState(null); const [conf, setConf] = useState(null);
      const [form, setForm] = useState({ billingId: '', name: '' });
      const [ef, setEf] = useState({ billingId: '', name: '' });

      const reload = useCallback(() => {
        setLoad(true);
        api('/api/billinguser').then(r => { const a = Array.isArray(r.data) ? r.data : []; setData(a); onCnt(a.length); }).catch(e => toast(e.message, 'err')).finally(() => setLoad(false));
      }, [api]);
      useEffect(() => { reload(); }, [reload]);

      const fd = data.filter(u => (u.name || '').toLowerCase().includes(srch.toLowerCase()) || String(u.billingId || '').includes(srch) || String(u.id || '').includes(srch));

      async function submit() {
        if (!form.name.trim()) { toast('Имя обязательно', 'err'); return; }
        try { const r = await api('/api/billinguser', { method: 'POST', body: JSON.stringify({ billingId: parseInt(form.billingId) || undefined, name: form.name }) }); toast(r.msg || 'Пользователь создан'); setModal(false); setForm({ billingId: '', name: '' }); reload(); } catch (e) { toast(e.message, 'err'); }
      }
      async function submitEdit() {
        if (!ef.name.trim()) { toast('Имя обязательно', 'err'); return; }
        try { const r = await api(`/api/billinguser/${editM.id}`, { method: 'PUT', body: JSON.stringify({ name: ef.name, billingId: parseInt(ef.billingId) || undefined }) }); toast(r.msg || 'Обновлено'); setEditM(null); reload(); } catch (e) { toast(e.message, 'err'); }
      }
      async function del(id) {
        try { const r = await api(`/api/billinguser/${id}`, { method: 'DELETE' }); toast(r.msg || 'Удалено'); reload(); } catch (e) { toast(e.message, 'err'); }
        setConf(null);
      }

      return (<>
        <div className="sec-head">
          <div><div className="sec-title">Пользователи Биллинга</div><div className="sec-sub">POST · GET · PUT · DELETE /api/billinguser</div></div>
          <div className="sec-acts">
            <div className="sw"><span className="si"><ISearch /></span><input className="sinp" placeholder="Поиск по имени, ID..." value={srch} onChange={e => setSrch(e.target.value)} /></div>

                  <td className="mono" style={{ color: 'var(--t3)' }}>#{u.id}</td>
                  <td className="mono" style={{ color: 'var(--ac)' }}>{u.billingId ?? '—'}</td>
                  <td style={{ fontWeight: 600 }}>{u.name ?? '—'}</td>
                  <td><div style={{ display: 'flex', gap: 5 }}>
                    <button className="btn btn-g btn-ic btn-sm" onClick={() => { setEditM(u); setEf({ billingId: String(u.billingId ?? ''), name: u.name ?? '' }); }}><IEdit /></button>
                    <button className="btn btn-d btn-ic btn-sm" onClick={() => setConf({ id: u.id, lbl: u.name })}><ITrash /></button>
                  </div></td>
                </tr>
              ))}
            </tbody>
          </table></div>
        </div>
        {modal && <NModal onClose={() => setModal(false)}>
          <div className="modal-title">Добавить пользователя Биллинга</div>

          <div><div className="sec-title">Коммутаторы</div><div className="sec-sub">POST · GET /api/switch</div></div>
          <div className="sec-acts">
            <div className="sw"><span className="si"><ISearch /></span><input className="sinp" placeholder="Поиск по IP, имени, ID..." value={srch} onChange={e => setSrch(e.target.value)} /></div>
            <button className="btn btn-p" onClick={() => setModal(true)}><IPlus />Добавить</button>
          </div>
        </div>
        <div className="tw card">
          <div className="ts"><table>
            <thead><tr><th>ID</th><th>IP</th><th>Port</th><th>Имя</th><th>Vendor ID</th><th>City ID</th></tr></thead>
            <tbody>
              {load && <tr><td colSpan={6}><NEmpty title="Загрузка..." /></td></tr>}
              {!load && fd.length === 0 && <tr><td colSpan={6}><NEmpty title="Нет коммутаторов" sub="Добавьте первый коммутатор" /></td></tr>}
              {!load && fd.map(s => (
                <tr key={s.id}>
                  <td className="mono" style={{ color: 'var(--t3)' }}>#{s.id}</td>
                  <td className="mono" style={{ color: 'var(--ac)', fontWeight: 600 }}>{s.ip ?? '—'}</td>
                  <td className="mono">{s.port ?? '—'}</td>
                  <td style={{ fontWeight: 600 }}>{s.name ?? '—'}</td>
                  <td className="mono" style={{ color: 'var(--t3)' }}>{s.vendorId ?? '—'}</td>
                  <td className="mono" style={{ color: 'var(--t3)' }}>{s.cityId ?? '—'}</td>

              ))}

          </table></div>
        </div>

          <div className="modal-sub">POST /api/switch</div>

            <div className="fg"><label className="fl">IP *</label><input className="fi" placeholder="192.168.1.1" value={form.ip} onChange={e => setForm(f => ({ ...f, ip: e.target.value }))} /></div>
            <div className="fg"><label className="fl">Port</label><input className="fi" type="number" placeholder="22" value={form.port} onChange={e => setForm(f => ({ ...f, port: e.target.value }))} /></div>
          </div>
          <div className="fg"><label className="fl">Имя</label><input className="fi" placeholder="SW-Core-01" value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} /></div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
            <div className="fg"><label className="fl">Vendor ID</label><input className="fi" type="number" placeholder="1" value={form.vendorId} onChange={e => setForm(f => ({ ...f, vendorId: e.target.value }))} /></div>
            <div className="fg"><label className="fl">City ID</label><input className="fi" type="number" placeholder="1" value={form.cityId} onChange={e => setForm(f => ({ ...f, cityId: e.target.value }))} /></div>

        </NModal>}
      </>);
    }

    // COMMON
    function NSChip({ s }) {
      const l = (s || '').toLowerCase();
      const c = l === 'active' ? 'c-active' : l === 'inactive' ? 'c-inactive' : l === 'archived' ? 'c-archived' : 'c-other';
      return <span className={`chip ${c}`}>{s || '—'}</span>;
    }
    function NEmpty({ title, sub }) {
      return <div className="empty"><div className="empty-title">{title}</div>{sub && <div className="empty-sub">{sub}</div>}</div>;
    }
    function NModal({ children, onClose }) {
      return (
        <div className="overlay" onClick={e => e.target === e.currentTarget && onClose()}>
          <div className="modal card">
            <div className="modal-stripe" />
            <div className="modal-body">{children}</div>
          </div>
        </div>
      );
    }
    function NConfirmDel({ text, onOk, onNo }) {
      return (
        <div className="overlay" onClick={e => e.target === e.currentTarget && onNo()}>
          <div className="modal card" style={{ maxWidth: 340 }}>
            <div className="modal-stripe" />
            <div className="modal-body">
              <div className="del-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--rd)" strokeWidth="2" strokeLinecap="round">
                  <polyline points="3 6 5 6 21 6" /><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4h6v2" />
                </svg>
              </div>
              <div className="modal-title">Удалить запись?</div>
              <div style={{ fontSize: 13, color: 'var(--t2)', marginTop: 6 }}>{text}</div>
              <div className="modal-acts">
                <button className="btn btn-g" onClick={onNo}>Отмена</button>
                <button className="btn btn-d" style={{ fontWeight: 700 }} onClick={onOk}>Удалить</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    

    // НОРМАЛЬНАЯ — ГОРОДА
    function NCityPage({ api, onCnt }) {
      const [data, setData] = useState([]); const [load, setLoad] = useState(true);
      const [srch, setSrch] = useState(''); const [modal, setModal] = useState(false);
      const [editM, setEditM] = useState(null); const [conf, setConf] = useState(null);
      const [form, setForm] = useState({ name: '' }); const [ef, setEf] = useState({ name: '' });

      const reload = useCallback(() => {
        setLoad(true);
        api('/api/city').then(r => { const a = Array.isArray(r.data) ? r.data : []; setData(a); onCnt(a.length); }).catch(e => toast(e.message, 'err')).finally(() => setLoad(false));
      }, [api]);
      useEffect(() => { reload(); }, [reload]);

      const fd = data.filter(c => (c.name||'').toLowerCase().includes(srch.toLowerCase()) || String(c.id||'').includes(srch));

      async function submit() {
        if (!form.name.trim()) { toast('Название обязательно', 'err'); return; }
        try { const r = await api('/api/city', { method: 'POST', body: JSON.stringify({ name: form.name }) }); toast(r.msg||'Город добавлен'); setModal(false); setForm({name:''}); reload(); } catch(e){ toast(e.message,'err'); }
      }
      async function submitEdit() {
        if (!ef.name.trim()) { toast('Название обязательно', 'err'); return; }
        try { const r = await api(`/api/city/${editM.id}`, { method: 'PUT', body: JSON.stringify({ name: ef.name }) }); toast(r.msg||'Обновлено'); setEditM(null); reload(); } catch(e){ toast(e.message,'err'); }
      }
      async function del(id) {
        try { const r = await api(`/api/city/${id}`, { method: 'DELETE' }); toast(r.msg||'Удалено'); reload(); } catch(e){ toast(e.message,'err'); }
        setConf(null);
      }

      return (<>
        <div className="sec-head">
          <div><div className="sec-title">Города</div><div className="sec-sub">POST · GET · PUT · DELETE /api/city</div></div>
          <div className="sec-acts">
            <div className="sw"><span className="si"><ISearch /></span><input className="sinp" placeholder="Поиск..." value={srch} onChange={e => setSrch(e.target.value)} /></div>
            <button className="btn btn-p" onClick={() => setModal(true)}><IPlus />Добавить</button>
          </div>
        </div>
        <div className="tw card"><div className="ts"><table>
          <thead><tr><th>ID</th><th>Название</th><th>Действия</th></tr></thead>
          <tbody>
            {load && <tr><td colSpan={3}><NEmpty title="Загрузка..." /></td></tr>}
            {!load && fd.length===0 && <tr><td colSpan={3}><NEmpty title="Нет городов" sub="Добавьте первый город" /></td></tr>}
            {!load && fd.map(c => (
              <tr key={c.id}>
                <td className="mono" style={{color:'var(--t3)'}}>#{c.id}</td>
                <td style={{fontWeight:600}}>{c.name??'—'}</td>
                <td><div style={{display:'flex',gap:5}}>
                  <button className="btn btn-g btn-ic btn-sm" onClick={() => { setEditM(c); setEf({name:c.name||''}); }}><IEdit /></button>
                  <button className="btn btn-d btn-ic btn-sm" onClick={() => setConf({id:c.id,lbl:c.name})}><ITrash /></button>
                </div></td>
              </tr>
            ))}
          </tbody>
        </table></div></div>
        {modal && <NModal onClose={() => setModal(false)}>
          <div className="modal-title">Добавить город</div>
          <div className="modal-sub">POST /api/city</div>
          <div className="fg"><label className="fl">Название *</label><input className="fi" placeholder="Душанбе" value={form.name} onChange={e => setForm(f=>({...f,name:e.target.value}))} /></div>
          <div className="modal-acts"><button className="btn btn-g" onClick={() => setModal(false)}>Отмена</button><button className="btn btn-p" onClick={submit}>Добавить</button></div>
        </NModal>}
        {editM && <NModal onClose={() => setEditM(null)}>
          <div className="modal-title">Редактировать город</div>
          <div className="modal-sub">PUT /api/city/{editM.id}</div>
          <div className="fg"><label className="fl">Название *</label><input className="fi" placeholder="Душанбе" value={ef.name} onChange={e => setEf(f=>({...f,name:e.target.value}))} /></div>
          <div className="modal-acts"><button className="btn btn-g" onClick={() => setEditM(null)}>Отмена</button><button className="btn btn-p" onClick={submitEdit}>Сохранить</button></div>
        </NModal>}
        {conf && <NConfirmDel text={`Удалить «${conf.lbl}»?`} onOk={() => del(conf.id)} onNo={() => setConf(null)} />}
      </>);
    }

    // НОРМАЛЬНАЯ — ВЕНДОРЫ

                <td className="mono" style={{color:'var(--t3)'}}>#{v.id}</td>
                <td style={{fontWeight:600}}>{v.name??'—'}</td>
                <td><div style={{display:'flex',gap:5}}>
                  <button className="btn btn-g btn-ic btn-sm" onClick={() => { setEditM(v); setEf({name:v.name||''}); }}><IEdit /></button>
                  <button className="btn btn-d btn-ic btn-sm" onClick={() => setConf({id:v.id,lbl:v.name})}><ITrash /></button>

        {modal && <NModal onClose={() => setModal(false)}>
          <div className="modal-title">Добавить вендора</div>
          <div className="modal-sub">POST /api/vendor</div>
          <div className="fg"><label className="fl">Название *</label><input className="fi" placeholder="Cisco" value={form.name} onChange={e => setForm(f=>({...f,name:e.target.value}))} /></div>
          <div className="modal-acts"><button className="btn btn-g" onClick={() => setModal(false)}>Отмена</button><button className="btn btn-p" onClick={submit}>Добавить</button></div>
        </NModal>}
        {editM && <NModal onClose={() => setEditM(null)}>
          <div className="modal-title">Редактировать вендора</div>
          <div className="modal-sub">PUT /api/vendor/{editM.id}</div>
          <div className="fg"><label className="fl">Название *</label><input className="fi" placeholder="Cisco" value={ef.name} onChange={e => setEf(f=>({...f,name:e.target.value}))} /></div>
          <div className="modal-acts"><button className="btn btn-g" onClick={() => setEditM(null)}>Отмена</button><button className="btn btn-p" onClick={submitEdit}>Сохранить</button></div>

    }


    // ── ROOT APP — переключает между Lain и Normal ───────────────────
    function RootApp() {
      const [mode, setMode] = useState(() =>
        document.documentElement.classList.contains('theme-light') ? 'normal' : 'lain'
      );
      const [transitioning, setTransitioning] = useState(false);
      const [base, setBase] = useState('http://10.251.4.199:5000');

      useEffect(() => {
        function onToggle() {
          if (transitioning) return;
          setTransitioning(true);

          // Flash overlay
          const ov = document.getElementById('theme-transition-overlay');
          if (ov) {
            ov.style.opacity = '1';
            setTimeout(() => { ov.style.opacity = '0'; }, 200);
          }

          setTimeout(() => {
            setMode(m => {
              const next = m === 'lain' ? 'normal' : 'lain';
              document.documentElement.classList.toggle('theme-light', next === 'normal');
              document.documentElement.setAttribute('data-theme', next === 'normal' ? 'light' : 'dark');
              if (next === 'normal' && window.__applyNormalCSS) window.__applyNormalCSS();
              if (next === 'lain'   && window.__removeNormalCSS) window.__removeNormalCSS();
              return next;
            });
            setTransitioning(false);
          }, 120);
        }

        // Listen for the theme toggle event
        window.__toggleTheme = onToggle;
      }, [transitioning]);

      if (mode === 'lain') return <App base={base} setBase={setBase} />;
      return <NApp base={base} setBase={setBase} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<RootApp />);
  </script>
</body>
</script>
